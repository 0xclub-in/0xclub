<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>0xbook - IPL 2026 Prediction Demo</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <header class="topbar">
    <h1>0xbook</h1>
    <p>
      by
      <a href="https://0xclub.in" target="_blank" rel="noopener noreferrer">0xclub</a>
    </p>
  </header>

  <main class="app-shell">
    <section class="wallet card">
      <h2>Demo Wallet</h2>
      <p class="balance">Coins: <span id="coinBalance">1000</span></p>
      <div class="fund-actions">
        <button id="addFundsBtn">Add Funds (+500)</button>
        <button id="resetBtn" class="secondary">Reset Demo</button>
      </div>
      <p id="walletMessage" class="hint"></p>
      <p class="small-note">
        This is an activity-based demo, not a real betting platform.
      </p>
    </section>

    <section class="fixture card">
      <h2>IPL 2026 Fixture Predictions</h2>
      <div class="form-grid">
        <label>
          Select Match
          <select id="fixtureSelect"></select>
        </label>

        <label>
          Prediction Type
          <select id="predictionType">
            <option value="winner">Match Winner</option>
            <option value="most-runs">Most Runs (Team)</option>
            <option value="most-sixes">Most Sixes (Team)</option>
            <option value="powerplay">Better Powerplay (Team)</option>
            <option value="wildcard">Wildcard Moment</option>
          </select>
        </label>

        <label>
          Your Prediction
          <input id="predictionInput" type="text" placeholder="e.g., CSK or Last-over finish" />
        </label>

        <label>
          Bet Coins
          <input id="betAmount" type="number" min="1" value="50" />
        </label>
      </div>

      <button id="placePredictionBtn">Place Prediction</button>
      <p id="predictionMessage" class="hint"></p>
    </section>

    <section class="multiplier card">
      <h2>Multiplier Challenge</h2>
      <p>Guess the multiplier (1.00x to 5.00x). If your guess is same or more than target, you win.</p>
      <div class="form-grid">
        <label>
          Your Guess (x)
          <input id="multiplierGuess" type="number" min="1" max="5" step="0.01" value="2.00" />
        </label>
        <label>
          Bet Coins
          <input id="multiplierBet" type="number" min="1" value="100" />
        </label>
      </div>
      <button id="playMultiplierBtn">Play Multiplier</button>
      <p id="multiplierMessage" class="hint"></p>
    </section>

    <section class="feed card">
      <h2>Activity Feed</h2>
      <ul id="activityFeed"></ul>
    </section>
  </main>

  <script src="./main.js"></script>
</body>
</html>
